apiVersion: apps/v1
kind: Deployment
metadata:
  name: orin-client
  labels:
    app.kubernetes.io/name: orin-client
    app.kubernetes.io/part-of: orin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orin-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orin-client
        app.kubernetes.io/part-of: orin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: client
          image: vishnumadhu13/orin-client   # tag set by kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orin-client
  labels:
    app.kubernetes.io/name: orin-client
    app.kubernetes.io/part-of: orin
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: orin-client
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
