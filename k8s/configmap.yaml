apiVersion: v1
kind: ConfigMap
metadata:
  name: orin-config
  labels:
    app.kubernetes.io/part-of: orin
data:
  NODE_ENV: "production"
  PORT: "5000"
  # The URL you open in the browser (port-forward on Minikube, see DEPLOY.md)
  CLIENT_URL: "http://localhost:8088"
  COOKIE_SECURE: "false"   # set "true" only behind HTTPS
  MAX_UPLOAD_MB: "25"
