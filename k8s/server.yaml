apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orin-uploads
  labels:
    app.kubernetes.io/name: orin-server
    app.kubernetes.io/part-of: orin
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orin-server
  labels:
    app.kubernetes.io/name: orin-server
    app.kubernetes.io/part-of: orin
spec:
  # Single replica: Socket.IO rooms are in-memory and uploads use a RWO volume.
  # Scaling out needs the Socket.IO Redis adapter + Cloudinary (or RWX storage).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orin-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orin-server
        app.kubernetes.io/part-of: orin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36.1
          command: ["sh", "-c", "until nc -z orin-mongo 27017; do echo waiting for mongo; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: server
          image: vishnumadhu13/orin-server   # tag set by kustomization.yaml
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: orin-config
            - secretRef:
                name: orin-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: orin-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: orin-server
  labels:
    app.kubernetes.io/name: orin-server
    app.kubernetes.io/part-of: orin
spec:
  selector:
    app.kubernetes.io/name: orin-server
  ports:
    - name: http
      port: 5000
      targetPort: http
