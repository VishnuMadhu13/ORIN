# NOT part of kustomization.yaml and must never be committed with real values.
# Create the real secret once per cluster instead:
#
#   kubectl -n orin create secret generic orin-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 64)" \
#     --from-literal=MONGODB_URI="mongodb://orin-mongo:27017/orin"
#
# Optional keys: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#                SMTP_HOST, SMTP_USER, SMTP_PASS
apiVersion: v1
kind: Secret
metadata:
  name: orin-secrets
  namespace: orin
type: Opaque
stringData:
  JWT_SECRET: "replace-with-openssl-rand-hex-64"
  MONGODB_URI: "mongodb://orin-mongo:27017/orin"
