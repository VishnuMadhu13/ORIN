apiVersion: v1
kind: Service
metadata:
  name: orin-mongo
  labels:
    app.kubernetes.io/name: orin-mongo
    app.kubernetes.io/part-of: orin
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: orin-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orin-mongo
  labels:
    app.kubernetes.io/name: orin-mongo
    app.kubernetes.io/part-of: orin
spec:
  serviceName: orin-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orin-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orin-mongo
        app.kubernetes.io/part-of: orin
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongo
          image: mongo:6.0
          ports:
            - name: mongo
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
